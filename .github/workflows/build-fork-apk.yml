name: Generar APK de prueba del fork

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    name: Compilar APK release de arbol5-modelo-ofertas
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Descargar rama de prueba
        uses: actions/checkout@v6
        with:
          ref: arbol5-modelo-ofertas

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Flutter 3.47.3
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.3
          channel: stable
          cache: true

      - name: Descargar dependencias
        run: flutter pub get

      - name: Ejecutar pruebas
        run: flutter test

      - name: Preparar credenciales del backend
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          printf '{"SUPABASE_URL":"%s","SUPABASE_PUBLISHABLE_KEY":"%s","BUILD_SHA":"fork-test","BUILD_RAMA":"arbol5-modelo-ofertas"}\n' \
            "$SUPABASE_URL" "$SUPABASE_PUBLISHABLE_KEY" > env.json
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::warning::Faltan SUPABASE_URL o SUPABASE_PUBLISHABLE_KEY; la APK compilara, pero no podra cargar el catalogo real."
          fi

      - name: Compilar APK release de prueba
        run: flutter build apk --release --dart-define-from-file=env.json

      - name: Guardar APK release
        uses: actions/upload-artifact@v7
        with:
          name: apk-prueba-arbol5-release
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
          if-no-files-found: error
